services:
  db:
    image: postgres:15.1-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data/
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:6.2.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 1s
      timeout: 1s
      retries: 5

  backend:
    build: .
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: ${POSTGRES_PORT}
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  static_collector:
    build: .
    entrypoint: [ "/bin/sh", "-c", "chown -R app:app /app/static && python manage.py collectstatic -c --noinput" ]
    env_file: .env
    volumes:
      - django_static:/app/static/
    restart: "no"

  celery_worker:
    build: .
    command: /home/app/.local/bin/celery -A config worker --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - db
    volumes:
      - .:/app

  celery_beat:
    build: .
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler --schedule=/app/celerybeat-schedule-dir/celerybeat-schedule
    env_file: .env
    depends_on:
      - redis
      - db
    volumes:
      - .:/app
      - celery_beat_data:/app/celerybeat-schedule-dir

  web:
    image: nginx:1.19.3
    ports:
      - "80:80"
    depends_on:
      - backend
      - static_collector
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - django_static:/usr/share/nginx/html/static/


volumes:
  pg_data:
  django_static:
  celery_beat_data: